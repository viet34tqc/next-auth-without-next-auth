name: Deploy to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      update_env:
        description: 'Update .env file on VPS?'
        required: true
        default: 'no'
        type: choice
        options:
          - yes
          - no
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/next-auth-without-next-auth

            echo "Checking if .env file exists..."
            if [ "${{ github.event.inputs.update_env }}" = "true" ]; then
              echo "Overwriting .env from GitHub Secrets..."
              echo "DATABASE_URL=file:./dev.db" > .env
              echo "GITHUB_CLIENT_ID=${{ secrets.GB_CLIENT_ID }}" >> .env
              echo "GITHUB_CLIENT_SECRET=${{ secrets.GB_CLIENT_SECRET }}" >> .env
            else
              echo "Skipping .env update."
            fi

            echo "Pulling latest code and rebuilding..."
            git pull
            docker compose up -d --build
